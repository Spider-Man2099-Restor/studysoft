<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>StudySoft Cards</title>

  <link rel="stylesheet" href="style.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link rel="icon" type = "image/png" href="/images/logo.png">
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  >
</head>

<body>

  <main class="card-container">

    <!-- FRONT CARD -->
    <section class="card card-front">

      <div class="front-content">
        <img
          src="logo.png"
          alt="StudySoft Logo"
          class="logo"
        >

        <h1 class="brand-title">StudySoft</h1>

        <p class="tagline">
          EMPOWER YOUR STUDIES WITH PREMIUM SOFTWARE
        </p>
      </div>

      <div class="website">
        www.StudySoft.com
      </div>

    </section>


    <!-- BACK CARD -->
    <section class="card card-back">

      <div class="back-body">

        <div class="left-text">
          <h2>Study<br>Soft</h2>

          <div class="name-text">
            <p class="person-name">Restor, Joshua C.</p>
            <p class="person-title">CEO</p>
          </div>
        </div>

        <div class="right-icons">
          <img
            src="icons.png"
            alt="App Icons"
            class="icons-graphic"
          >
        </div>

      </div>

      <div class="contact-info">
        <span>www.SoftStudy.com</span>

        <div class="divider"></div>

        <span>contact@SoftStudyHug.com</span>

        <div class="divider"></div>

        <span>(684) 879 - 0102</span>
      </div>

    </section>

  </main>

</body>
</html>
